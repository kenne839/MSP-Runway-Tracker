; PlatformIO Project Configuration File for MSP Runway LED Tracker
; Target Hardware: ESP32-S3-WROOM-1-N16R8 (16MB Flash, 8MB Octal PSRAM)

[platformio]
default_envs = home_wifi

[common]
platform = espressif32 @ ^6.5.0
board = esp32-s3-devkitc-1
framework = arduino

; Serial Monitor & Upload Configuration
monitor_speed = 115200
upload_speed = 921600

; Memory & Chip Settings for ESP32-S3-WROOM-1-N16R8
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi

lib_deps =
    fastled/FastLED @ ^3.6.0
    adafruit/Adafruit SSD1306 @ ^2.5.9
    adafruit/Adafruit GFX Library @ ^1.11.9
    bblanchon/ArduinoJson @ ^7.0.4

; ==============================================================================
; Environment 1: Home Board (Wi-Fi + Raspberry Pi REST Server)
; ==============================================================================
[env:home_wifi]
extends = common
build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_MODE_WIFI=1

; ==============================================================================
; Environment 2: Office Board (BLE + Office PC Python Bridge)
; ==============================================================================
[env:office_ble]
extends = common
build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_MODE_BLE=1
